# DubVAE full-size config (encoder ~51M, decoder ~117M). 24 kHz <-> 25 Hz x 64.
model:
  latent_dim: 64
  enc_channels: 48
  dec_channels: 1536
  strides: [2, 4, 5, 4, 6]        # product 960 -> 25 Hz
  dec_kernels: [3, 7, 11]
  dec_dilations: [1, 3, 5]
  semantic_dim: 1024              # RedAE-style head -> w2v-BERT 2.0 features (0 = disabled)

semantic:
  teacher: w2v_bert               # w2v_bert | fallback | none
  layer: 16
  weight: 2.0

disc:
  periods: [2, 3, 5, 7, 11]
  stft_ffts: [512, 1024, 2048]
  channels: 32

loss:
  mel: 15.0
  adv: 1.0
  feat: 2.0
  kl: 0.01

data:
  manifest: data/vae_manifest.jsonl   # {"id", "audio"} rows (any speech + some non-speech)
  segment_sec: 1.28
  num_workers: 8

train:
  out_dir: runs/vae
  batch_size: 16                  # per GPU
  lr_g: 2.0e-4
  lr_d: 2.0e-4
  betas: [0.8, 0.99]
  max_steps: 800000
  disc_start_step: 20000          # pure reconstruction warm-up
  log_every: 100
  save_every: 10000
  grad_clip: 1000.0
  precision: bf16                 # bf16 | fp32
